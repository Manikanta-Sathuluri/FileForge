name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ImagesToPDF --paths src src/app.py

      - name: SHA256
        shell: pwsh
        run: |
          (Get-FileHash "dist/ImagesToPDF.exe" -Algorithm SHA256).Hash | Out-File "dist/SHA256.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImagesToPDF-Windows
          path: |
            dist/ImagesToPDF.exe
            dist/SHA256.txt
