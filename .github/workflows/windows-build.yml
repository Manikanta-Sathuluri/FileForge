name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FileForge --paths src src/app.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\FileForge.exe")) {
            Write-Error "FileForge.exe was not created."
            exit 1
          }

          Write-Host "FileForge.exe created successfully."
          Get-Item "dist\FileForge.exe" | Format-List Name, Length, FullName

      - name: SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\FileForge.exe" -Algorithm SHA256).Hash
          $hash | Out-File "dist\FileForge.exe.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileForge-Windows
          path: |
            dist/FileForge.exe
            dist/FileForge.exe.sha256