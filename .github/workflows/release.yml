name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Test
        run: python -m pytest

      - name: Build
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FileForge --paths src src\app.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\FileForge.exe")) {
            Write-Error "FileForge.exe was not created."
            exit 1
          }

          Write-Host "FileForge.exe created successfully."
          Get-Item "dist\FileForge.exe" | Format-List Name, Length, FullName

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\FileForge.exe" -Algorithm SHA256).Hash
          $hash | Out-File "dist\FileForge.exe.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileForge.exe
            dist/FileForge.exe.sha256
          generate_release_notes: true